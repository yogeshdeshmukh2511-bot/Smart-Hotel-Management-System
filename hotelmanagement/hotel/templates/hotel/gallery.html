<!DOCTYPE html>
<html>

<head>
    <title>Hotel Gallery</title>

    {% load static %}
    <link rel="stylesheet" href="{% static 'hotel/style.css' %}">

    <style>
        .gallery {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 25px;
            padding: 30px;
        }

        .gallery-card {
            width: 300px;
            background: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 3px 10px rgba(0,0,0,0.15);
        }

        .gallery-card img {
            width: 100%;
            height: 220px;
            object-fit: cover;
        }

        .gallery-card h3 {
            text-align: center;
            padding: 15px;
            margin: 0;
        }
    </style>
</head>

<body>

<nav>
    <a href="/">HOME</a>
    <a href="/rooms/">ROOMS</a>
    <a href="/guests/">GUESTS</a>
    <a href="/bookings/">BOOKINGS</a>
    <a href="/booking-history/">HISTORY</a>
    <a href="/gallery/">GALLERY</a>
</nav>

<h1>Smart Hotel Gallery</h1>

<div class="gallery">

    <div class="gallery-card">
        <img src="{% static 'hotel/images/hotel.jpeg' %}">
        <h3>Our Hotel</h3>
    </div>

    <div class="gallery-card">
        <img src="{% static 'hotel/images/room101.jpeg' %}">
        <h3>Room 101</h3>
    </div>

    <div class="gallery-card">
        <img src="{% static 'hotel/images/room102.jpeg' %}">
        <h3>Room 102</h3>
    </div>

    <div class="gallery-card">
        <img src="{% static 'hotel/images/deluxe.jpeg' %}">
        <h3>Deluxe Room</h3>
    </div>

    <div class="gallery-card">
        <img src="{% static 'hotel/images/suite.jpeg' %}">
        <h3>Suite Room</h3>
    </div>

</div>

</body>
</html>
